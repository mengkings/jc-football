name: 每月刷新球队评分
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 下载最新数据并重新训练
        run: |
          for s in 2425 2526; do for l in E0 SP1 I1 D1 F1; do
            curl -sL --max-time 60 -o "data/${l}_${s}.csv" "https://www.football-data.co.uk/mmz4281/${s}/${l}.csv" || true
          done; done
          python3 tools/model.py
          python3 tools/gen_ratings_js.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 自动刷新球队评分 (数据源 football-data.co.uk)"
          git push
